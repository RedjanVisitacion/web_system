name: Deploy website to InfinityFree

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out website source
        uses: actions/checkout@v4

      - name: Verify required pages exist
        run: |
          test -f index.html
          test -f dashboard.html
          test -f attendance.html

      - name: Upload website files with FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.INFINITY_FTP_HOST }}
          username: ${{ secrets.INFINITY_FTP_USERNAME }}
          password: ${{ secrets.INFINITY_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ustporoq.fast-page.org/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .agents/**
            .codex/**
            SETUP.md
            debug.log
            attendance-web.zip
            node_modules/**
            .DS_Store
