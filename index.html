<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Attendance System administrator portal" />
    <title>Attendance System | Admin</title>
    <link rel="icon" type="image/png" href="assets/img/USTP-ORO.png" />
    <link rel="apple-touch-icon" href="assets/img/USTP-ORO.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css?v=20260713-password-toggle" />
  </head>
  <body>
    <main class="login-shell">
      <section class="poster" aria-labelledby="system-title">
        <div class="poster__grid" aria-hidden="true"></div>
        <div class="poster__overlay" aria-hidden="true"></div>

        <div class="poster__content">
          <div class="poster__main">
            <img class="ustp-poster-logo" src="assets/img/USTP-ORO.png" alt="USTP Oroquieta" />
          </div>
        </div>
      </section>

      <section class="login-panel" aria-label="Administrator sign in">
        <div class="login-card" aria-live="polite">
          <div id="login-view">
            <header class="login-brand">
              <p class="modern-attendance-title">Modern Attendance</p>
            </header>

            <form id="login-form" class="login-form" novalidate>
              <div class="field">
                <label for="student-id">Student ID</label>
                <div class="input-frame">
                  <i class="bi bi-person-badge" aria-hidden="true"></i>
                  <input
                    id="student-id"
                    name="studentId"
                    type="text"
                    inputmode="numeric"
                    pattern="\d{10}"
                    maxlength="10"
                    placeholder="e.g. 2023304637"
                    autocomplete="username"
                    required
                  />
                </div>
              </div>

              <div class="field">
                <label for="password">Password</label>
                <div class="input-frame input-frame--password">
                  <i class="bi bi-lock" aria-hidden="true"></i>
                  <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
                  <button
                    id="password-toggle"
                    class="password-toggle"
                    type="button"
                    aria-label="Show password"
                    aria-pressed="false"
                  >
                    <i class="bi bi-eye" aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <p id="form-message" class="message" role="alert" hidden></p>
              <button id="login-button" class="btn" type="submit">
                <i class="bi bi-shield-check" aria-hidden="true"></i><span>Sign in securely</span>
              </button>
            </form>
          </div>

          <div id="dashboard-view" hidden>
            <header class="login-brand">
              <span class="brand-mark" aria-hidden="true"><i class="bi bi-clipboard2-check"></i></span>
              <div>
                <strong>Attendance System</strong>
                <span>Administrator Portal</span>
              </div>
            </header>
            <div class="login-heading dashboard-heading">
              <h2>Welcome back</h2>
              <p id="signed-in-student-id"></p>
              <p id="signed-in-name" class="signed-in-name"></p>
            </div>
            <div class="ready-panel">
              <i class="bi bi-check2-circle" aria-hidden="true"></i>
              <div>
                <strong id="bootstrap-status">Firebase is connected</strong>
                <span id="bootstrap-detail">Attendance sessions, student records, and reports can be added next.</span>
              </div>
            </div>
            <button id="logout-button" class="btn btn--secondary" type="button"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Sign out</span></button>
          </div>

          <footer class="login-footer">© 2026 Redjan Phil S. Visitacion</footer>
        </div>
      </section>
    </main>

    <script type="module" src="assets/js/app.js?v=20260713-password-toggle"></script>
  </body>
</html>
