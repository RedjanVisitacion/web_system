<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Attendance System administrator portal" />
    <title>Attendance System | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css?v=20260713-ustp-logo" />
  </head>
  <body>
    <main class="login-shell">
      <section class="poster" aria-labelledby="system-title">
        <div class="poster__grid" aria-hidden="true"></div>
        <div class="poster__overlay" aria-hidden="true"></div>

        <div class="poster__content">
          <div class="poster__main">
            <img class="ustp-poster-logo" src="assets/img/USTP-ORO.png" alt="USTP Oroquieta" />
          </div>
        </div>
      </section>

      <section class="login-panel" aria-label="Administrator sign in">
        <div class="login-card" aria-live="polite">
          <div id="login-view">
            <header class="login-brand">
              <img class="ustp-login-logo" src="assets/img/USTP-ORO.png" alt="USTP Oroquieta" />
            </header>

            <form id="login-form" class="login-form" novalidate>
              <div class="field">
                <label for="email">Email address</label>
                <div class="input-frame">
                  <i class="bi bi-envelope" aria-hidden="true"></i>
                  <input id="email" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required />
                </div>
              </div>

              <div class="field">
                <label for="password">Password</label>
                <div class="input-frame">
                  <i class="bi bi-lock" aria-hidden="true"></i>
                  <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
                </div>
              </div>

              <p id="form-message" class="message" role="alert" hidden></p>
              <button id="login-button" class="btn" type="submit">
                <i class="bi bi-shield-check" aria-hidden="true"></i><span>Sign in securely</span>
              </button>
            </form>
          </div>

          <div id="dashboard-view" hidden>
            <header class="login-brand">
              <span class="brand-mark" aria-hidden="true"><i class="bi bi-clipboard2-check"></i></span>
              <div>
                <strong>Attendance System</strong>
                <span>Administrator Portal</span>
              </div>
            </header>
            <div class="login-heading dashboard-heading">
              <h2>Welcome back</h2>
              <p id="signed-in-email"></p>
            </div>
            <div class="ready-panel">
              <i class="bi bi-check2-circle" aria-hidden="true"></i>
              <div><strong>Firebase is connected</strong><span>Attendance sessions, student records, and reports can be added next.</span></div>
            </div>
            <button id="logout-button" class="btn btn--secondary" type="button"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Sign out</span></button>
          </div>

          <footer class="login-footer">© 2026 Redjan Phil S. Visitacion</footer>
        </div>
      </section>
    </main>

    <script type="module" src="assets/js/app.js?v=20260713-firebase-key-fix"></script>
  </body>
</html>
