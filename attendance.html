<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management - Attendance System</title>
    <link rel="icon" type="image/png" href="assets/img/USTP-ORO.png">
    <link rel="apple-touch-icon" href="assets/img/USTP-ORO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/dashboard.css?v=20260718-dropdown-align">
</head>
<body class="theme-attendance">

    <div id="layoutMount"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div id="appbarMount"></div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Page Header -->
            <div class="page-header">
                <h1>Attendance Management</h1>
                <p class="text-muted">Create and manage attendance activities and events</p>
            </div>

            <!-- Create Activity Button -->
            <div class="mb-4">
                <button class="btn btn-primary" id="createActivityBtn">
                    <i class="bi bi-plus-circle"></i>
                    <span>Create New Activity</span>
                </button>
            </div>

            <!-- Activities List -->
            <div class="card activities-card">
                <div class="card-body">
                    <h5 class="mb-3">Attendance Activities</h5>
                    <div id="activitiesList">
                        <div class="text-muted text-center py-4">
                            <i class="bi bi-inbox fs-1 mb-2 d-block"></i>
                            No activities created yet
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Activity Modal -->
    <div class="modal fade" id="createActivityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Activity</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createActivityForm">
                        <div class="mb-3">
                            <label for="activityName" class="form-label">Activity Name</label>
                            <input type="text" class="form-control" id="activityName" required placeholder="e.g., Lecture 1, Lab Session, Exam">
                        </div>
                        <div class="mb-3">
                            <label for="activityDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="activityDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="activityTime" class="form-label">Time</label>
                            <input type="time" class="form-control" id="activityTime" required>
                        </div>
                        <div class="mb-3">
                            <label for="activityLocation" class="form-label">Location</label>
                            <input type="text" class="form-control" id="activityLocation" required placeholder="e.g., Room 101, Laboratory">
                        </div>
                        <div class="mb-3">
                            <label for="activityType" class="form-label">Activity Type</label>
                            <select class="form-select" id="activityType" required>
                                <option value="">Select type</option>
                                <option value="lecture">Lecture</option>
                                <option value="lab">Laboratory</option>
                                <option value="exam">Exam</option>
                                <option value="seminar">Seminar</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="activityDescription" class="form-label">Description (Optional)</label>
                            <textarea class="form-control" id="activityDescription" rows="3" placeholder="Additional details about the activity"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveActivityBtn">Create Activity</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/attendance.js?v=20260717-layout"></script>
</body>
</html>
