<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Attendance System</title>
    <link rel="icon" type="image/png" href="assets/img/USTP-ORO.png">
    <link rel="apple-touch-icon" href="assets/img/USTP-ORO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/dashboard.css?v=20260717-attendance-nav">
</head>
<body class="theme-attendance">

    <div id="layoutMount"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div id="appbarMount"></div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Welcome Banner -->
            <div class="welcome-banner">
                <div class="welcome-content">
                    <h1 id="welcomeTitle">Welcome back</h1>
                    <p id="welcomeSubtitle">Student ID: <span id="studentIdDisplay"></span></p>
                    <p id="welcomeName" class="welcome-name"></p>
                </div>
                <div class="welcome-icon">
                    <i class="bi bi-person-circle"></i>
                </div>
            </div>

            <!-- Status Cards -->
            <div class="row g-3 mb-4">
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="stat-card">
                        <div class="stat-icon stat-icon-primary">
                            <i class="bi bi-clipboard-check"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">Total Sessions</div>
                            <div class="stat-value" id="totalSessions">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="stat-card">
                        <div class="stat-icon stat-icon-success">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">Present Today</div>
                            <div class="stat-value" id="presentToday">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="stat-card">
                        <div class="stat-icon stat-icon-warning">
                            <i class="bi bi-clock"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">Late Today</div>
                            <div class="stat-value" id="lateToday">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="stat-card">
                        <div class="stat-icon stat-icon-danger">
                            <i class="bi bi-x-circle"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">Absent Today</div>
                            <div class="stat-value" id="absentToday">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Database Status -->
            <div class="card status-card">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3">
                        <div class="status-icon status-icon-success">
                            <i class="bi bi-database-check"></i>
                        </div>
                        <div class="flex-grow-1">
                            <h5 class="mb-1" id="dbStatusTitle">Database Connected</h5>
                            <p class="mb-0 text-muted" id="dbStatusDetail">Collections are ready. Attendance tracking is active.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card activity-card">
                <div class="card-body">
                    <h5 class="mb-3">Recent Activity</h5>
                    <div id="recentActivity">
                        <div class="text-muted text-center py-4">
                            <i class="bi bi-inbox fs-1 mb-2 d-block"></i>
                            No recent activity
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/dashboard.js?v=20260717-layout"></script>
</body>
</html>
